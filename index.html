<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunny's Songs Playlist</title>

<style>
html {
    background-color: #ff7f00;
    padding: 10px;
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: calc(100vh - 20px);
    background-color: #000;
    font-family: Arial, sans-serif;
    color: orange;
    border-radius: 25px;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;
}

.main {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* TITLE */
.title-container{
display:grid;
grid-template-columns:auto auto auto auto auto;
align-items:center;
justify-content:center;
column-gap:6px;
font-size:1.1em;
margin-bottom:25px;
}

.start-centered{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
z-index:100;
}

.rgb-animated{
animation:rainbowText 5s linear infinite;
}

.arrow{
font-size:0.8em;
margin:0 6px;
cursor:pointer;
animation:rainbowText 5s linear infinite;
text-shadow:0 0 8px currentColor,0 0 16px currentColor;
transition:transform .2s ease;
}

.arrow:hover{ transform:scale(1.3); }

.emoji{
display:inline-block;
margin:0 5px;
font-size:0.9em;
animation:glowRGB 3s linear infinite, dance 1.5s ease-in-out infinite;
}

/* CATEGORY */
.category-row{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
margin-bottom:20px;
flex-wrap:wrap;
}

.category-container{
font-size:1.2em;
color:#ff7f00;
}

/* ===== EQ ===== */
.equalizer{
display:flex;
align-items:flex-end;
gap:2px;
height:22px;
margin-top:10px;
}

.bar{
width:3px;
height:3px;
border-radius:999px;
transition:all .05s linear;
}

.eq-red{background:#ff0033; box-shadow:0 0 6px #ff0033;}
.eq-orange{background:#ff7a00; box-shadow:0 0 6px #ff7a00;}
.eq-yellow{background:#ffd000; box-shadow:0 0 6px #ffd000;}
.eq-green{background:#00ff66; box-shadow:0 0 6px #00ff66;}
.eq-cyan{background:#00ffff; box-shadow:0 0 6px #00ffff;}
.eq-blue{background:#0066ff; box-shadow:0 0 6px #0066ff;}
.eq-purple{background:#a800ff; box-shadow:0 0 6px #a800ff;}
.eq-pink{background:#ff4fd8; box-shadow:0 0 6px #ff4fd8;}

/* CONTROLS */
.controls{
display:flex;
align-items:center;
justify-content:center;
gap:12px;
margin-top:15px;
flex-wrap:wrap;
}

button{
padding:7px 18px;
font-size:0.85em;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
background:#FFA500;
transition:transform .25s ease;
}

button:hover{ transform:scale(1.08); }

button.rgb-bg{
animation:rainbowBG 5s linear infinite;
}

/* ===== RGB VOLUME SLIDER ===== */
#volume{
-webkit-appearance:none;
appearance:none;
width:140px;
height:6px;
border-radius:10px;
background:linear-gradient(90deg,red,orange,yellow,green,cyan,blue,purple,red);
outline:none;
cursor:pointer;
box-shadow:0 0 10px #ff9800;
}

#volume::-webkit-slider-thumb{
-webkit-appearance:none;
width:16px;
height:16px;
border-radius:50%;
background:white;
border:2px solid black;
box-shadow:0 0 10px red,0 0 20px blue;
}

#volume::-moz-range-thumb{
width:16px;
height:16px;
border-radius:50%;
background:white;
border:2px solid black;
}

/* AUDIO */
audio{display:none;}

/* ANIMATIONEN */
@keyframes rainbowText{
0%{color:#ff0000;}
16%{color:#ff7f00;}
32%{color:#ffff00;}
48%{color:#00ff00;}
64%{color:#00ffff;}
80%{color:#8b00ff;}
100%{color:#ff0000;}
}

@keyframes rainbowBG{
0%{background:#ff0000;}
16%{background:#ff7f00;}
32%{background:#ffff00;}
48%{background:#00ff00;}
64%{background:#00ffff;}
80%{background:#8b00ff;}
100%{background:#ff0000;}
}

@keyframes glowRGB{
0%{text-shadow:0 0 8px red;}
50%{text-shadow:0 0 16px cyan;}
100%{text-shadow:0 0 8px red;}
}

@keyframes dance{
0%{transform:translateY(0) rotate(-8deg);}
50%{transform:translateY(-6px) rotate(8deg);}
100%{transform:translateY(0) rotate(-8deg);}
}
</style>
</head>

<body>

<div class="main">

<div class="title-container start-centered" id="titleContainer">
<span id="prev" class="arrow">⬅️</span>
<span class="emoji">🎶</span>
<span id="songTitle" class="rgb-animated">Sunny's Songs</span>
<span class="emoji">🎶</span>
<span id="next" class="arrow">➡️</span>
</div>

<div class="category-row">
<div id="songCategory"></div>

<div class="equalizer">
<span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
<span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
<span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
<span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
</div>
</div>

<div class="controls">
<button id="playPauseBtn" style="display:none;">🔊 Play Now</button>

<div id="volumeContainer" style="display:none;">
<span>🔉</span>
<input id="volume" type="range" min="0" max="1" step="0.01" value="1">
<span>🔊</span>
</div>
</div>

<audio id="audio"></audio>

</div>

<script>
const songs=[
{title:"Der kleine Jingle",file:"Jingle.aac",category:"Sunny's Schätze"},
{title:"Cha-La Head-Cha-La",file:"Cha-La Head-Cha-La.aac",category:"Dragonball Z"},
{title:"Die Legende",file:"Die Legende.aac",category:"One Piece"},
{title:"Leb deinen Traum",file:"Leb deinen Traum.aac",category:"Digimon"},
{title:"Frei wie der Wind",file:"Frei wie der Wind.aac",category:"Monster Rancher"},
{title:"Last Unicorn",file:"Last Unicorn.aac",category:"Das Letzte Einhorn"},
{title:"Leaves from the Vine",file:"Leaves from the Vine.aac",category:"Avatar – Der Herr der Elemente"},
{title:"Heidruns Schlaflied",file:"Heidruns Schlaflied.aac",category:"DreamWorks Dragons"}
];

let currentIndex=-1;

const audio=document.getElementById("audio");
const btn=document.getElementById("playPauseBtn");
const title=document.getElementById("songTitle");
const category=document.getElementById("songCategory");
const volume=document.getElementById("volume");
const volumeContainer=document.getElementById("volumeContainer");
const bars=document.querySelectorAll(".bar");
const titleContainer=document.getElementById("titleContainer");

audio.volume=1;

/* ===== RGB VOLUME ===== */
volume.addEventListener("input",()=>{
audio.volume=volume.value;
});

/* ===== EQ AUDIO ANALYSER ===== */
let ctx, analyser, source, data;

function setupAnalyzer(){
if(ctx) return;
ctx=new(window.AudioContext||window.webkitAudioContext)();
analyser=ctx.createAnalyser();
analyser.fftSize=128;
source=ctx.createMediaElementSource(audio);
source.connect(analyser);
analyser.connect(ctx.destination);
data=new Uint8Array(analyser.frequencyBinCount);
animateEQ();
}

/* ===== EQ ANIMATION ===== */
function animateEQ(){
requestAnimationFrame(animateEQ);
if(!analyser) return;

analyser.getByteFrequencyData(data);

bars.forEach((bar,i)=>{
const mapping=[2,4,6,9,13,18,24,32,32,24,18,13,9,6,4,2];

let v=data[mapping[i]]||0;
const h=Math.max(3,Math.min(22,v/10));

bar.style.height=h+"px";

bar.classList.remove("eq-red","eq-orange","eq-yellow","eq-green","eq-cyan","eq-blue","eq-purple","eq-pink");

if(h<5) bar.classList.add("eq-red");
else if(h<8) bar.classList.add("eq-orange");
else if(h<11) bar.classList.add("eq-yellow");
else if(h<14) bar.classList.add("eq-green");
else if(h<17) bar.classList.add("eq-cyan");
else if(h<19) bar.classList.add("eq-blue");
else if(h<21) bar.classList.add("eq-purple");
else bar.classList.add("eq-pink");
});
}

/* ===== SONGS ===== */
function loadSong(i){
currentIndex=i;
const s=songs[i];

audio.pause();
audio.src=s.file;

title.textContent=s.title;
category.textContent=s.category;

btn.style.display="block";
volumeContainer.style.display="flex";

btn.textContent="🔊 Play Now";
}

document.getElementById("prev").onclick=()=>{
loadSong(currentIndex<=0?songs.length-1:currentIndex-1);
};

document.getElementById("next").onclick=()=>{
loadSong(currentIndex>=songs.length-1?0:currentIndex+1);
};

btn.onclick=async()=>{
if(audio.paused){
setupAnalyzer();
if(ctx.state==="suspended") await ctx.resume();
audio.play();
btn.textContent="⏸️ Pause";
}else{
audio.pause();
btn.textContent="▶️ Play";
}
};
</script>

</body>
</html>
