<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunny's Songs Playlist</title>

<style>
html,body{
height:100%;
margin:0;
padding:0;
background:#000;
color:#fff;
font-family:sans-serif;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
}

.title-container{
display:flex;
align-items:center;
justify-content:center;
font-size:1.1em;
margin-bottom:10px;
}

.rgb-animated{
animation:rainbowText 5s linear infinite;
}

.arrow{
font-size:0.8em;
margin:0 6px;
cursor:pointer;
animation:rainbowText 5s linear infinite;
transition:transform .2s ease,text-shadow .2s ease;
text-shadow:0 0 8px currentColor,0 0 16px currentColor;
}

.arrow:hover{
transform:scale(1.3);
text-shadow:0 0 10px currentColor,0 0 20px currentColor,0 0 30px currentColor;
}

/* 🎶 TANZENDE NOTEN */
.emoji{
display:inline-block;
margin:0 5px;
font-size:0.9em;
animation:glowRGB 3s linear infinite, dance 1.5s ease-in-out infinite;
}

.category-row{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
margin-bottom:20px;
}

.category-container{
font-size:1.2em;
color:#ff7f00;
}

.equalizer{
display:flex;
align-items:flex-end;
gap:2px;
height:22px;
}

.bar{
width:3px;
height:3px;
border-radius:999px;
background:#ff3030;
transition:all .06s linear;
}

.controls{
display:flex;
align-items:center;
gap:12px;
margin-top:10px;
}

button{
padding:7px 18px;
font-size:0.85em;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
background:#FFA500;
transition:transform .25s ease, box-shadow .25s ease;
}

button:hover{
transform:scale(1.08) translateY(-2px);
box-shadow:0 0 12px #FFA500,0 0 24px #FFA500;
}

button.rgb-bg{
animation:rainbowBG 5s linear infinite;
}

#volume{
-webkit-appearance:none;
appearance:none;
width:120px;
height:22px;
background:transparent;
cursor:pointer;
}

#volume::-webkit-slider-runnable-track{
height:6px;
border-radius:10px;
background:#000;
animation:rainbowBG 5s linear infinite;
}

#volume::-webkit-slider-thumb{
-webkit-appearance:none;
appearance:none;
width:14px;
height:14px;
border-radius:50%;
background:#fff;
border:2px solid #000;
cursor:pointer;
animation:rainbowText 5s linear infinite;
box-shadow:0 0 8px currentColor,0 0 12px currentColor;
margin-top:-4px;
}

#volume::-moz-range-track{
height:6px;
border-radius:10px;
background:#000;
animation:rainbowBG 5s linear infinite;
}

#volume::-moz-range-thumb{
width:14px;
height:14px;
border-radius:50%;
background:#fff;
border:2px solid #000;
cursor:pointer;
animation:rainbowText 5s linear infinite;
box-shadow:0 0 8px currentColor,0 0 12px currentColor;
}

audio{display:none;}

@keyframes rainbowText{
0%{color:#ff0000;}
16%{color:#ff7f00;}
32%{color:#ffff00;}
48%{color:#00ff00;}
64%{color:#00ffff;}
80%{color:#8b00ff;}
100%{color:#ff0000;}
}

@keyframes rainbowBG{
0%{background:#ff0000;}
16%{background:#ff7f00;}
32%{background:#ffff00;}
48%{background:#00ff00;}
64%{background:#00ffff;}
80%{background:#8b00ff;}
100%{background:#ff0000;}
}

@keyframes glowRGB{
0%{text-shadow:0 0 8px red,0 0 16px red;}
16%{text-shadow:0 0 8px orange,0 0 16px orange;}
32%{text-shadow:0 0 8px yellow,0 0 16px yellow;}
48%{text-shadow:0 0 8px lime,0 0 16px lime;}
64%{text-shadow:0 0 8px cyan,0 0 16px cyan;}
80%{text-shadow:0 0 8px violet,0 0 16px violet;}
100%{text-shadow:0 0 8px red,0 0 16px red;}
}

/* 🎵 dance upgrade */
@keyframes dance{
0%,100%{transform:translateY(0) rotate(0deg) scale(1);}
25%{transform:translateY(-4px) rotate(-10deg) scale(1.1);}
50%{transform:translateY(4px) rotate(10deg) scale(1.15);}
75%{transform:translateY(-3px) rotate(-6deg) scale(1.08);}
}
</style>
</head>

<body>

<div class="title-container">
<span id="prev" class="arrow">⬅️</span>
<span class="emoji">🎶</span>
<span id="songTitle" class="rgb-animated">Sunny's Songs</span>
<span class="emoji">🎶</span>
<span id="next" class="arrow">➡️</span>
</div>

<div class="category-row">
<div id="songCategory" class="category-container"></div>

<div class="equalizer">
<span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
<span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
<span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
<span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
<span class="bar"></span><span class="bar"></span>
</div>
</div>

<div class="controls">
<button id="playPauseBtn" style="display:none;">🔊 Play Now</button>

<div>
<span>🔉</span>
<input id="volume" type="range" min="0" max="1" step="0.01" value="1">
<span>🔊</span>
</div>
</div>

<audio id="audio"></audio>

<script>
const songs=[
{title:"Der kleine Jingle",file:"Jingle.aac",category:"Sunny's Schätze"},
{title:"Cha-La Head-Cha-La",file:"Cha-La Head-Cha-La.aac",category:"Dragonball Z"},
{title:"Die Legende",file:"Die Legende.aac",category:"One Piece"},
{title:"Leb deinen Traum",file:"Leb deinen Traum.aac",category:"Digimon"},
{title:"Frei wie der Wind",file:"Frei wie der Wind.aac",category:"Monster Rancher"},
{title:"Last Unicorn",file:"Last Unicorn.aac",category:"Das Letzte Einhorn"},
{title:"Leaves from the Vine",file:"Leaves from the Vine.aac",category:"Avatar – Der Herr der Elemente"},
{title:"Heidruns Schlaflied",file:"Heidruns Schlaflied.aac",category:"DreamWorks Dragons"}
];

let currentIndex=-1;
const audio=document.getElementById("audio");
const btn=document.getElementById("playPauseBtn");
const title=document.getElementById("songTitle");
const category=document.getElementById("songCategory");
const volume=document.getElementById("volume");
const bars=document.querySelectorAll(".bar");

audio.volume=1;
volume.addEventListener("input",()=>audio.volume=volume.value);

let ctx, analyser, source, data;

function setupAnalyzer(){
if(ctx) return;
ctx=new(window.AudioContext||window.webkitAudioContext)();
analyser=ctx.createAnalyser();
analyser.fftSize=128;
source=ctx.createMediaElementSource(audio);
source.connect(analyser);
analyser.connect(ctx.destination);
data=new Uint8Array(analyser.frequencyBinCount);
animate();
}

function loadSong(i){
currentIndex=i;
const s=songs[i];
audio.pause();
audio.src=s.file;
title.textContent=s.title;
category.textContent=s.category;
btn.style.display="block";
btn.textContent="🔊 Play Now";
btn.classList.remove("rgb-bg");
}

document.getElementById("prev").onclick=()=>{
loadSong(currentIndex===-1?songs.length-1:(currentIndex-1+songs.length)%songs.length);
};

document.getElementById("next").onclick=()=>{
loadSong(currentIndex===-1?0:(currentIndex+1)%songs.length);
};

btn.onclick=async()=>{
if(audio.paused){
setupAnalyzer();
if(ctx.state==="suspended") await ctx.resume();
audio.play();
btn.textContent="⏸️ Pause";
btn.classList.add("rgb-bg");
}else{
audio.pause();
btn.textContent="🔊 Play Now";
btn.classList.remove("rgb-bg");
}
};

function animate(){
requestAnimationFrame(animate);
if(!analyser) return;

analyser.getByteFrequencyData(data);

bars.forEach((bar,i)=>{
const v=data[Math.floor(i*data.length/bars.length)]||0;
const h=Math.max(3,Math.min(22,v/10));
bar.style.height=h+"px";

if(h<8) bar.style.background="#ff3030";
else if(h<14) bar.style.background="#ffd000";
else bar.style.background="#00ff66";
});
}
</script>

</body>
</html>
