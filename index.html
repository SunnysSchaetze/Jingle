<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunny's Songs Playlist</title>

<style>
html, body {
  height: 100%;
  margin: 0;
  background: #000;
  font-family: sans-serif;
}

/* 🔥 CENTER */
body {
  display: flex;
  justify-content: center;
  align-items: center;
}

/* APP WRAPPER */
.app {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

/* TITLE */
.title-container {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 1.1em;
  margin-bottom: 25px;
}

.start-centered {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

.rgb-animated {
  animation: rainbowText 5s linear infinite;
}

.arrow {
  font-size: 0.8em;
  cursor: pointer;
  animation: rainbowText 5s linear infinite;
  text-shadow: 0 0 8px currentColor, 0 0 16px currentColor;
}

.arrow:hover {
  transform: scale(1.3);
}

.emoji {
  display: inline-block;
  margin: 0 5px;
  animation: glowRGB 3s linear infinite, dance 1.5s infinite;
}

/* CATEGORY */
.category-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}

.category-container {
  font-size: 1.2em;
  color: #ff7f00;
}

/* EQ */
.equalizer {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 22px;
}

.bar {
  width: 3px;
  height: 3px;
  border-radius: 999px;
  transition: all .06s linear;
}

/* EQ COLORS */
.eq-red{background:#ff0033; box-shadow:0 0 6px #ff0033;}
.eq-orange{background:#ff7a00; box-shadow:0 0 6px #ff7a00;}
.eq-yellow{background:#ffd000; box-shadow:0 0 6px #ffd000;}
.eq-green{background:#00ff66; box-shadow:0 0 6px #00ff66;}
.eq-cyan{background:#00ffff; box-shadow:0 0 6px #00ffff;}
.eq-blue{background:#0066ff; box-shadow:0 0 6px #0066ff;}
.eq-purple{background:#a800ff; box-shadow:0 0 6px #a800ff;}
.eq-pink{background:#ff4fd8; box-shadow:0 0 6px #ff4fd8;}

/* CONTROLS */
.controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  margin-top: 10px;
}

/* BUTTON */
button {
  padding: 7px 18px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  background: #FFA500;
  transition: .2s;
}

button:hover {
  transform: scale(1.08);
  box-shadow: 0 0 12px #FFA500;
}

button.rgb-bg {
  animation: rainbowBG 5s linear infinite;
}

/* 🎛️ VOLUME RGB */
.volume-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
}

#volume {
  -webkit-appearance: none;
  appearance: none;
  width: 140px;
  background: transparent;
  cursor: pointer;
}

/* TRACK */
#volume::-webkit-slider-runnable-track {
  height: 6px;
  border-radius: 10px;
  animation: rainbowBG 5s linear infinite;
}

/* THUMB */
#volume::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #ff9800;
  border: 2px solid #000;
  animation: rainbowText 5s linear infinite;
  box-shadow: 0 0 10px currentColor;
  margin-top: -5px;
}

/* AUDIO */
audio { display:none; }

/* ANIMATIONS */
@keyframes rainbowText {
  0%{color:#ff0000;}
  16%{color:#ff7f00;}
  32%{color:#ffff00;}
  48%{color:#00ff00;}
  64%{color:#00ffff;}
  80%{color:#8b00ff;}
  100%{color:#ff0000;}
}

@keyframes rainbowBG {
  0%{background:#ff0000;}
  16%{background:#ff7f00;}
  32%{background:#ffff00;}
  48%{background:#00ff00;}
  64%{background:#00ffff;}
  80%{background:#8b00ff;}
  100%{background:#ff0000;}
}

@keyframes glowRGB {
  0%{text-shadow:0 0 8px red;}
  50%{text-shadow:0 0 12px cyan;}
  100%{text-shadow:0 0 8px red;}
}

@keyframes dance {
  0%{transform:translateY(0) rotate(-8deg);}
  50%{transform:translateY(-6px) rotate(8deg);}
  100%{transform:translateY(0) rotate(-8deg);}
}
</style>
</head>

<body>

<div class="app">

  <div class="title-container start-centered" id="titleContainer">
    <span id="prev" class="arrow">⬅️</span>
    <span class="emoji">🎶</span>
    <span id="songTitle" class="rgb-animated">Sunny's Songs</span>
    <span class="emoji">🎶</span>
    <span id="next" class="arrow">➡️</span>
  </div>

  <div class="category-row">
    <div id="songCategory" class="category-container"></div>

    <div class="equalizer">
      <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
      <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
      <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
      <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
    </div>
  </div>

  <div class="controls">
    <button id="playPauseBtn" style="display:none;">🔊 Play Now</button>

    <div id="volumeContainer" style="display:none;" class="volume-wrap">
      <span class="emoji">🔉</span>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="1">
      <span class="emoji">🔊</span>
    </div>
  </div>

</div>

<audio id="audio"></audio>

<script>
const songs=[
{title:"Der kleine Jingle",file:"Jingle.aac",category:"Sunny's Schätze"},
{title:"Cha-La Head-Cha-La",file:"Cha-La Head-Cha-La.aac",category:"Dragonball Z"},
{title:"Die Legende",file:"Die Legende.aac",category:"One Piece"},
{title:"Leb deinen Traum",file:"Leb deinen Traum.aac",category:"Digimon"},
{title:"Frei wie der Wind",file:"Frei wie der Wind.aac",category:"Monster Rancher"},
{title:"Last Unicorn",file:"Last Unicorn.aac",category:"Das Letzte Einhorn"},
{title:"Leaves from the Vine",file:"Leaves from the Vine.aac",category:"Avatar – Der Herr der Elemente"},
{title:"Heidruns Schlaflied",file:"Heidruns Schlaflied.aac",category:"DreamWorks Dragons"}
];

let currentIndex=-1;

const audio=document.getElementById("audio");
const btn=document.getElementById("playPauseBtn");
const title=document.getElementById("songTitle");
const category=document.getElementById("songCategory");
const volume=document.getElementById("volume");
const volumeContainer=document.getElementById("volumeContainer");
const bars=document.querySelectorAll(".bar");
const titleContainer=document.getElementById("titleContainer");

audio.volume=1;

volume.addEventListener("input",()=>audio.volume=volume.value);

let ctx, analyser, source, data;

function setupAnalyzer(){
if(ctx) return;
ctx=new AudioContext();
analyser=ctx.createAnalyser();
analyser.fftSize=128;
source=ctx.createMediaElementSource(audio);
source.connect(analyser);
analyser.connect(ctx.destination);
data=new Uint8Array(analyser.frequencyBinCount);
animate();
}

function loadSong(i){
titleContainer.classList.remove("start-centered");

currentIndex=i;
const s=songs[i];

audio.pause();
audio.src=s.file;

title.textContent=s.title;
category.textContent=s.category;

btn.style.display="block";
volumeContainer.style.display="flex";

btn.textContent="🔊 Play Now";
btn.classList.remove("rgb-bg");
}

document.getElementById("prev").onclick=()=>{
loadSong(currentIndex===-1?songs.length-1:(currentIndex-1+songs.length)%songs.length);
};

document.getElementById("next").onclick=()=>{
loadSong(currentIndex===-1?0:(currentIndex+1)%songs.length);
};

btn.onclick=async()=>{
if(audio.paused){
setupAnalyzer();
if(ctx.state==="suspended") await ctx.resume();
audio.play();
btn.textContent="⏸️ Pause";
btn.classList.add("rgb-bg");
}else{
audio.pause();
btn.textContent="▶️ Play";
btn.classList.remove("rgb-bg");
}
};

function animate(){
requestAnimationFrame(animate);
if(!analyser) return;

analyser.getByteFrequencyData(data);

bars.forEach((bar,i)=>{
const mapping=[2,4,6,9,13,18,24,32,32,24,18,13,9,6,4,2];
let v=data[mapping[i]]||0;

const h=Math.max(3,Math.min(22,v/10));
bar.style.height=h+"px";

bar.className="bar ";

if(h<5) bar.classList.add("eq-red");
else if(h<8) bar.classList.add("eq-orange");
else if(h<11) bar.classList.add("eq-yellow");
else if(h<14) bar.classList.add("eq-green");
else if(h<17) bar.classList.add("eq-cyan");
else if(h<19) bar.classList.add("eq-blue");
else if(h<21) bar.classList.add("eq-purple");
else bar.classList.add("eq-pink");
});
}
</script>

</body>
</html>
