<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sunny's Songs Playlist</title>
<style>
html,body{
height:100%;margin:0;padding:0;background:#000;color:#fff;
font-family:sans-serif;display:flex;justify-content:center;
align-items:center;flex-direction:column;text-align:center;
}
.title-container{display:flex;align-items:center;font-size:1.6em;margin-bottom:10px}
.rgb-animated{animation:rainbowText 5s infinite}
.arrow{font-size:1.3em;cursor:pointer;margin:0 10px}
.category-row{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
margin-bottom:20px;
}
.category-container{
color:#ff7f00;
font-size:1.2em;
}
.equalizer{
display:flex;
align-items:flex-end;
justify-content:center;
gap:2px;
height:22px;
}
.bar{
width:3px;
height:3px;
border-radius:999px;
background:#ff3030;
transition:height .06s linear,background-color .06s linear,box-shadow .06s linear;
}
button{
padding:10px 25px;border:none;border-radius:8px;
font-weight:bold;cursor:pointer;background:#FFA500;color:#000;
}
button.rgb-bg{animation:rainbowBG 5s infinite}
audio{display:none}

@keyframes rainbowText{
0%{color:red}16%{color:orange}32%{color:yellow}
48%{color:lime}64%{color:cyan}80%{color:violet}100%{color:red}
}
@keyframes rainbowBG{
0%{background:red}16%{background:orange}32%{background:yellow}
48%{background:lime}64%{background:cyan}80%{background:violet}100%{background:red}
}
</style>
</head>
<body>

<div class="title-container">
<span id="prev" class="arrow rgb-animated">⬅️</span>
🎶 <span id="songTitle" class="rgb-animated">Sunny's Songs</span> 🎶
<span id="next" class="arrow rgb-animated">➡️</span>
</div>

<div class="category-row">
<div id="songCategory" class="category-container"></div>

<div class="equalizer">
<span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
<span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
<span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
<span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
<span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
<span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
</div>
</div>

<button id="playPauseBtn" style="display:none;">🔊 Play Now</button>
<audio id="audio"></audio>

<script>
const songs=[
{title:"Der kleine Jingle",file:"Jingle.aac",category:"Sunny's Schätze"},
{title:"Cha-La Head-Cha-La",file:"Cha-La Head-Cha-La.aac",category:"Dragonball Z"},
{title:"Die Legende",file:"Die Legende.aac",category:"One Piece"},
{title:"Leb deinen Traum",file:"Leb deinen Traum.aac",category:"Digimon"},
{title:"Frei wie der Wind",file:"Frei wie der Wind.aac",category:"Monster Rancher"},
{title:"Last Unicorn",file:"Last Unicorn.aac",category:"Das Letzte Einhorn"},
{title:"Leaves from the Vine",file:"Leaves from the Vine.aac",category:"Avatar – Der Herr der Elemente"},
{title:"Heidruns Schlaflied",file:"Heidruns Schlaflied.aac",category:"DreamWorks Dragons"}
];

let currentIndex=-1;
const audio=document.getElementById("audio");
const btn=document.getElementById("playPauseBtn");
const title=document.getElementById("songTitle");
const category=document.getElementById("songCategory");
const bars=document.querySelectorAll(".bar");

let ctx, analyser, source, data;

function setupAnalyzer(){
 if(ctx) return;
 ctx=new(window.AudioContext||window.webkitAudioContext)();
 analyser=ctx.createAnalyser();
 analyser.fftSize=128;
 source=ctx.createMediaElementSource(audio);
 source.connect(analyser);
 analyser.connect(ctx.destination);
 data=new Uint8Array(analyser.frequencyBinCount);
 animateEqualizer();
}

function loadSong(i){
 currentIndex=i;
 const s=songs[i];
 audio.pause();
 audio.src=s.file;
 title.textContent=s.title;
 category.textContent=s.category;
 btn.style.display="block";
 btn.textContent="🔊 Play Now";
}

document.getElementById("prev").onclick=()=>{
 loadSong(currentIndex===-1?songs.length-1:(currentIndex-1+songs.length)%songs.length);
};

document.getElementById("next").onclick=()=>{
 loadSong(currentIndex===-1?0:(currentIndex+1)%songs.length);
};

btn.onclick=async()=>{
 if(audio.paused){
  setupAnalyzer();
  if(ctx.state==="suspended") await ctx.resume();
  audio.play();
  btn.textContent="⏸️ Pause";
  btn.classList.add("rgb-bg");
 }else{
  audio.pause();
  btn.textContent="🔊 Play Now";
  btn.classList.remove("rgb-bg");
 }
};

function animateEqualizer(){
 if(analyser){
   analyser.getByteFrequencyData(data);

   bars.forEach((bar,index)=>{
     const value=data[Math.floor(index*data.length/bars.length)]||0;
     const height=Math.max(3,Math.min(22,value/10));

     bar.style.height=height+"px";

     if(height<8){
       bar.style.background="#ff3030";
       bar.style.boxShadow="0 0 4px #ff3030";
     }else if(height<14){
       bar.style.background="#ffd000";
       bar.style.boxShadow="0 0 6px #ffd000";
     }else{
       bar.style.background="#00ff66";
       bar.style.boxShadow="0 0 8px #00ff66,0 0 12px #00ff66";
     }
   });
 }
 requestAnimationFrame(animateEqualizer);
}
</script>
</body>
</html>
