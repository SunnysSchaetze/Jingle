<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunny's Songs Playlist</title>

<style>
html {
    height: 100%;
    margin: 0;
    padding: 2px;
    box-sizing: border-box;
    background-color: #ff7f00;
}

* {
    box-sizing: border-box;
}

body {
    width: 100%;
    height: 100%;
    margin: 0;

    background:
        linear-gradient(#000,#000) padding-box,
        linear-gradient(
            135deg,
            #ff7f00 0%,
            #ffd36a 15%,
            #fff4b0 28%,
            #ffea00 40%,
            #ffffff 50%,
            #ffcf4a 62%,
            #ff8a00 76%,
            #ffe38a 88%,
            #ff7f00 100%
        ) border-box;

    background-size:
        100% 100%,
        300% 300%;

    color: #fff;
    font-family: sans-serif;

    border: 3px solid transparent;
    border-radius: 25px;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;

    cursor: default;

    animation: holoOuter 8s ease-in-out infinite;

    position: relative;

    /*
       Innenabstand zum Rahmen.
       Dadurch bleibt der komplette Inhalt
       innerhalb des holografischen Innenrahmens.
    */
    padding: clamp(20px, 5vw, 45px);
}


/* =========================================================
   INHALT IM RAHMEN HALTEN
   ========================================================= */

.title-container,
.category-row,
.controls {
    position: relative;
    z-index: 2;
    max-width: 100%;
}

.title-container {
    width: min(100%, 700px);
}

.category-row {
    width: min(100%, 700px);
}

.controls {
    max-width: 100%;
    flex-wrap: wrap;
    justify-content: center;
}


/* =========================================================
   HOLOGRAFISCHER INNENRAHMEN
   OHNE GLOW
   ========================================================= */

body::before {
    content: "";

    position: absolute;

    top: 9px;
    left: 9px;
    right: 9px;
    bottom: 9px;

    padding: 2px;

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #ff7f00 0%,
            #ffd36a 15%,
            #fff4b0 28%,
            #ffea00 40%,
            #ffffff 50%,
            #ffcf4a 62%,
            #ff8a00 76%,
            #ffe38a 88%,
            #ff7f00 100%
        );

    background-size: 300% 300%;

    pointer-events: none;

    z-index: 1;

    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

    -webkit-mask-composite: xor;

    mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

    mask-composite: exclude;

    animation: holoInner 8s ease-in-out infinite;
}


/* =========================================================
   HOLOGRAFISCHER AUSSENRAHMEN
   ========================================================= */

@keyframes holoOuter {

    0% {
        background-position:
            0 0,
            0% 50%;
    }

    25% {
        background-position:
            0 0,
            50% 0%;
    }

    50% {
        background-position:
            0 0,
            100% 50%;
    }

    75% {
        background-position:
            0 0,
            50% 100%;
    }

    100% {
        background-position:
            0 0,
            0% 50%;
    }
}


/* =========================================================
   HOLOGRAFISCHER INNENRAHMEN
   ========================================================= */

@keyframes holoInner {

    0% {
        background-position:
            0% 50%;
    }

    25% {
        background-position:
            50% 0%;
    }

    50% {
        background-position:
            100% 50%;
    }

    75% {
        background-position:
            50% 100%;
    }

    100% {
        background-position:
            0% 50%;
    }
}


/* =========================================================
   PLAYLIST
   ========================================================= */

.title-container {
    display: grid;
    grid-template-columns: auto auto auto auto auto;
    align-items: center;
    justify-content: center;
    column-gap: 6px;
    font-size: 1.1em;
    margin-bottom: 25px;
}

.start-centered {
    position: relative;
    top: auto;
    left: auto;
    transform: none;
    z-index: 100;
}

.rgb-animated {
    animation: rainbowText 5s linear infinite;
}

.arrow {
    font-size: 0.8em;
    margin: 0 6px;
    cursor: pointer;
    animation: rainbowText 5s linear infinite;
    text-shadow:
        0 0 8px currentColor,
        0 0 16px currentColor;
    transition: transform .2s ease;
}

.arrow:hover {
    transform: scale(1.3);
}

.emoji {
    display: inline-block;
    margin: 0 5px;
    font-size: 0.9em;
    animation:
        glowRGB 3s linear infinite,
        dance 1.5s ease-in-out infinite;
}

.category-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
}

.category-container {
    font-size: 1.2em;
    color: #ff7f00;

    max-width: 100%;

    overflow-wrap: anywhere;
    word-break: break-word;
}

.equalizer {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 22px;

    flex-shrink: 0;
}

.bar {
    width: 3px;
    height: 3px;
    border-radius: 999px;
    transition: all .06s linear;
}

.eq-red {
    background: #ff0033;
    box-shadow: 0 0 6px #ff0033;
}

.eq-orange {
    background: #ff7a00;
    box-shadow: 0 0 6px #ff7a00;
}

.eq-yellow {
    background: #ffd000;
    box-shadow: 0 0 6px #ffd000;
}

.eq-green {
    background: #00ff66;
    box-shadow: 0 0 6px #00ff66;
}

.eq-cyan {
    background: #00ffff;
    box-shadow: 0 0 6px #00ffff;
}

.eq-blue {
    background: #0066ff;
    box-shadow: 0 0 6px #0066ff;
}

.eq-purple {
    background: #a800ff;
    box-shadow: 0 0 6px #a800ff;
}

.eq-pink {
    background: #ff4fd8;
    box-shadow: 0 0 6px #ff4fd8;
}

.controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
}

button {
    padding: 7px 18px;
    font-size: 0.85em;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    background: #FFA500;

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

button:hover {
    transform: scale(1.08);
    box-shadow:
        0 0 12px #FFA500,
        0 0 24px #FFA500;
}

button.rgb-bg {
    animation: rainbowBG 5s linear infinite;
}

#volume {
    -webkit-appearance: none;
    appearance: none;

    width: min(120px, 35vw);

    height: 22px;

    background: transparent;

    cursor: pointer;
}

#volume::-webkit-slider-runnable-track {
    height: 6px;
    border-radius: 10px;
    animation: rainbowBG 5s linear infinite;
}

#volume::-moz-range-track {
    height: 6px;
    border-radius: 10px;
    animation: rainbowBG 5s linear infinite;
}

#volume::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;

    width: 16px;
    height: 16px;

    border-radius: 50%;

    background: #ff9800;

    border: 2px solid #000;

    animation: rainbowText 5s linear infinite;

    box-shadow:
        0 0 8px currentColor,
        0 0 16px currentColor,
        0 0 24px currentColor;

    margin-top: -4px;
}

#volume::-moz-range-thumb {
    width: 16px;
    height: 16px;

    border-radius: 50%;

    background: #ff9800;

    border: 2px solid #000;

    animation: rainbowText 5s linear infinite;

    box-shadow:
        0 0 8px currentColor,
        0 0 16px currentColor,
        0 0 24px currentColor;
}

audio {
    display: none;
}


/* =========================================================
   CURSOR-GLITZER
   ========================================================= */

.glitzer {
    position: fixed;

    left: 0;
    top: 0;

    pointer-events: none;

    z-index: 99999;

    width: var(--size);
    height: var(--size);

    opacity: 0;

    transform:
        translate(-50%, -50%);

    background:
        radial-gradient(
            circle,
            #ffffff 0%,
            #fffde8 10%,
            var(--color) 28%,
            rgba(255,180,0,.60) 45%,
            transparent 72%
        );

    border-radius: 50%;

    filter:
        drop-shadow(0 0 3px var(--color))
        drop-shadow(0 0 7px var(--color))
        drop-shadow(0 0 12px rgba(255,150,0,.45));

    animation:
        cursorTrail
        var(--duration)
        cubic-bezier(.15,.55,.25,1)
        forwards;
}


/* Lichtstrahlen des Sterns */

.glitzer::before,
.glitzer::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    pointer-events: none;
}


/* horizontal */

.glitzer::before {
    width: 185%;
    height: 14%;

    background:
        linear-gradient(
            to right,
            transparent,
            rgba(255,255,255,.10),
            var(--color),
            #ffffff,
            var(--color),
            rgba(255,255,255,.10),
            transparent
        );

    border-radius: 999px;

    filter: blur(.3px);
}


/* vertikal */

.glitzer::after {
    width: 14%;
    height: 185%;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(255,255,255,.10),
            var(--color),
            #ffffff,
            var(--color),
            rgba(255,255,255,.10),
            transparent
        );

    border-radius: 999px;

    filter: blur(.3px);
}


/* größere Sterne */

.glitzer.long {
    filter:
        drop-shadow(0 0 4px #ffffff)
        drop-shadow(0 0 7px var(--color))
        drop-shadow(0 0 13px var(--color))
        drop-shadow(0 0 19px rgba(255,145,0,.35));
}


/* =========================================================
   GLITZERSTAUB
   ========================================================= */

.staub {
    position: fixed;

    left: 0;
    top: 0;

    pointer-events: none;

    z-index: 99998;

    width: var(--staub-size);
    height: var(--staub-size);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.72) 0%,
            var(--color) 28%,
            rgba(255,170,0,.42) 55%,
            transparent 100%
        );

    transform:
        translate(-50%, -50%);

    opacity: 0;

    box-shadow:
        0 0 4px var(--color),
        0 0 9px var(--color),
        0 0 16px rgba(255,150,0,.42),
        0 0 24px rgba(255,170,0,.18);

    animation:
        staubTrail
        var(--duration)
        ease-out
        forwards;
}


/* =========================================================
   CURSOR-SPUR ANIMATION
   ========================================================= */

@keyframes cursorTrail {

    0% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            translate(
                var(--sx),
                var(--sy)
            )
            scale(.18);
    }

    10% {
        opacity: .95;

        transform:
            translate(-50%, -50%)
            translate(
                var(--sx),
                var(--sy)
            )
            scale(1);
    }

    30% {
        opacity: .85;

        transform:
            translate(-50%, -50%)
            translate(
                var(--mx),
                var(--my)
            )
            scale(.9);
    }

    60% {
        opacity: .48;

        transform:
            translate(-50%, -50%)
            translate(
                var(--ex),
                var(--ey)
            )
            scale(.55);
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            translate(
                var(--ex),
                var(--ey)
            )
            scale(.08);
    }
}


/* =========================================================
   STAUB ANIMATION
   ========================================================= */

@keyframes staubTrail {

    0% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            translate(0,0)
            scale(.2);
    }

    20% {
        opacity: .8;

        transform:
            translate(-50%, -50%)
            translate(
                calc(var(--dx) * .25),
                calc(var(--dy) * .25)
            )
            scale(1);
    }

    65% {
        opacity: .55;

        transform:
            translate(-50%, -50%)
            translate(
                calc(var(--dx) * .65),
                calc(var(--dy) * .65)
            )
            scale(.8);
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            translate(
                var(--dx),
                var(--dy)
            )
            scale(.2);
    }
}


/* =========================================================
   KLICK-FLASH
   ========================================================= */

.klick-flash {
    position: fixed;

    left: 0;
    top: 0;

    width: 9px;
    height: 9px;

    border-radius: 50%;

    pointer-events: none;

    z-index: 100000;

    background:
        radial-gradient(
            circle,
            #ffffff 0%,
            #fff6a0 25%,
            #ffd000 50%,
            #ff7800 75%,
            transparent 100%
        );

    box-shadow:
        0 0 5px #fff000,
        0 0 12px #ffad00,
        0 0 22px #ff6500;

    transform:
        translate(-50%, -50%)
        scale(0);

    animation:
        flash .42s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}


/* =========================================================
   KLICK-FLASH ANIMATION
   ========================================================= */

@keyframes flash {

    0% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(0);
    }

    15% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.8);
    }

    45% {
        opacity: .8;

        transform:
            translate(-50%, -50%)
            scale(1);
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(.15);
    }
}


/* =========================================================
   RAINBOW ANIMATIONEN
   ========================================================= */

@keyframes rainbowText {
    0%   { color:#ff0000; }
    16%  { color:#ff7f00; }
    32%  { color:#ffff00; }
    48%  { color:#00ff00; }
    64%  { color:#00ffff; }
    80%  { color:#8b00ff; }
    100% { color:#ff0000; }
}

@keyframes rainbowBG {
    0%   { background:#ff0000; }
    16%  { background:#ff7f00; }
    32%  { background:#ffff00; }
    48%  { background:#00ff00; }
    64%  { background:#00ffff; }
    80%  { background:#8b00ff; }
    100% { background:#ff0000; }
}

@keyframes glowRGB {
    0% {
        text-shadow:0 0 8px red,0 0 16px red;
    }

    16% {
        text-shadow:0 0 8px orange,0 0 16px orange;
    }

    32% {
        text-shadow:0 0 8px yellow,0 0 16px yellow;
    }

    48% {
        text-shadow:0 0 8px lime,0 0 16px lime;
    }

    64% {
        text-shadow:0 0 8px cyan,0 0 16px cyan;
    }

    80% {
        text-shadow:0 0 8px violet,0 0 16px violet;
    }

    100% {
        text-shadow:0 0 8px red,0 0 16px red;
    }
}

@keyframes dance {
    0% {
        transform:translateY(0) rotate(-8deg) scale(1);
    }

    25% {
        transform:translateY(-8px) rotate(8deg) scale(1.15);
    }

    50% {
        transform:translateY(0) rotate(-8deg) scale(1);
    }

    75% {
        transform:translateY(-6px) rotate(8deg) scale(1.1);
    }

    100% {
        transform:translateY(0) rotate(-8deg) scale(1);
    }
}


/* =========================================================
   SMARTPHONE
   ========================================================= */

@media (max-width: 500px) {

    body {
        padding: 18px 14px;
    }

    .title-container {
        font-size: .95em;
        column-gap: 2px;
        margin-bottom: 18px;
    }

    .arrow {
        margin: 0 2px;
    }

    .emoji {
        margin: 0 2px;
    }

    .category-row {
        gap: 6px;
        margin-bottom: 15px;
    }

    .category-container {
        font-size: 1em;
    }

    .controls {
        gap: 7px;
        margin-top: 6px;
    }

    button {
        padding: 6px 12px;
        font-size: .8em;
    }

    #volume {
        width: 90px;
    }
}


/* =========================================================
   SEHR KLEINE SMARTPHONES
   ========================================================= */

@media (max-width: 360px) {

    body {
        padding: 16px 11px;
    }

    .title-container {
        font-size: .82em;
    }

    .category-container {
        font-size: .88em;
    }

    .equalizer {
        gap: 1px;
    }

    .bar {
        width: 2px;
    }

    button {
        padding: 5px 9px;
        font-size: .75em;
    }

    #volume {
        width: 75px;
    }
}


/* =========================================================
   REDUZIERTE ANIMATION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    .glitzer,
    .staub {
        animation-duration: .35s;
    }
}

</style>
</head>


<body>

<div class="title-container start-centered" id="titleContainer">

    <span id="prev" class="arrow">⬅️</span>

    <span class="emoji">🎶</span>

    <span id="songTitle" class="rgb-animated">
        Sunny's Songs
    </span>

    <span class="emoji">🎶</span>

    <span id="next" class="arrow">➡️</span>

</div>


<div class="category-row">

    <div id="songCategory" class="category-container"></div>

    <div class="equalizer">

        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>

        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>

        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>

        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>

    </div>

</div>


<div class="controls">

    <button id="playPauseBtn" style="display:none;">
        🔊 Play Now
    </button>

    <div id="volumeContainer" style="display:none;">

        <span>🔉</span>

        <input
            id="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="1"
        >

        <span>🔊</span>

    </div>

</div>


<audio id="audio"></audio>


<script>

/* =========================================================
   SONGS
   ========================================================= */

const songs = [

    {
        title:"Der kleine Jingle",
        file:"Jingle.aac",
        category:"Sunny's Schätze"
    },

    {
        title:"Cha-La Head-Cha-La",
        file:"Cha-La Head-Cha-La.aac",
        category:"Dragonball Z"
    },

    {
        title:"Die Legende",
        file:"Die Legende.aac",
        category:"One Piece"
    },

    {
        title:"Leb deinen Traum",
        file:"Leb deinen Traum.aac",
        category:"Digimon"
    },

    {
        title:"Frei wie der Wind",
        file:"Frei wie der Wind.aac",
        category:"Monster Rancher"
    },

    {
        title:"Last Unicorn",
        file:"Last Unicorn.aac",
        category:"Das Letzte Einhorn"
    },

    {
        title:"Leaves from the Vine",
        file:"Leaves from the Vine.aac",
        category:"Avatar – Der Herr der Elemente"
    },

    {
        title:"Heidruns Schlaflied",
        file:"Heidruns Schlaflied.aac",
        category:"DreamWorks Dragons"
    }

];


let currentIndex = -1;

const audio =
    document.getElementById("audio");

const btn =
    document.getElementById("playPauseBtn");

const title =
    document.getElementById("songTitle");

const category =
    document.getElementById("songCategory");

const volume =
    document.getElementById("volume");

const volumeContainer =
    document.getElementById("volumeContainer");

const bars =
    document.querySelectorAll(".bar");

const titleContainer =
    document.getElementById("titleContainer");


audio.volume = 1;


/* =========================================================
   LAUTSTÄRKE
   ========================================================= */

volume.addEventListener("input", () => {

    audio.volume = volume.value;

});


/* =========================================================
   SONG ENDE
   ========================================================= */

audio.addEventListener("ended", () => {

    btn.textContent = "🔊 Play";

    btn.classList.remove("rgb-bg");

});


/* =========================================================
   AUDIO ANALYZER
   ========================================================= */

let ctx,
    analyser,
    source,
    data;


function setupAnalyzer() {

    if (ctx) return;

    ctx =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    analyser =
        ctx.createAnalyser();

    analyser.fftSize = 128;

    source =
        ctx.createMediaElementSource(audio);

    source.connect(analyser);

    analyser.connect(ctx.destination);

    data =
        new Uint8Array(
            analyser.frequencyBinCount
        );

    animate();
}


/* =========================================================
   SONG LADEN
   ========================================================= */

function loadSong(i) {

    titleContainer.classList.remove(
        "start-centered"
    );

    currentIndex = i;

    const s = songs[i];

    audio.pause();

    audio.src = s.file;

    title.textContent = s.title;

    category.textContent = s.category;

    btn.style.display = "block";

    volumeContainer.style.display = "block";

    btn.textContent = "🔊 Play Now";

    btn.classList.remove("rgb-bg");

}


/* =========================================================
   VORHERIGER SONG
   ========================================================= */

document.getElementById("prev").onclick = () => {

    loadSong(
        currentIndex === -1
            ? songs.length - 1
            : (
                currentIndex - 1 +
                songs.length
            ) % songs.length
    );

};


/* =========================================================
   NÄCHSTER SONG
   ========================================================= */

document.getElementById("next").onclick = () => {

    loadSong(
        currentIndex === -1
            ? 0
            : (
                currentIndex + 1
            ) % songs.length
    );

};


/* =========================================================
   PLAY / PAUSE
   ========================================================= */

btn.onclick = async () => {

    if (audio.paused) {

        setupAnalyzer();

        if (ctx.state === "suspended") {
            await ctx.resume();
        }

        audio.play();

        btn.textContent = "⏸️ Pause";

        btn.classList.add("rgb-bg");

    } else {

        audio.pause();

        btn.textContent = "▶️ Play";

        btn.classList.remove("rgb-bg");

    }

};


/* =========================================================
   EQUALIZER
   ========================================================= */

function animate() {

    requestAnimationFrame(animate);

    if (!analyser) return;

    analyser.getByteFrequencyData(data);

    bars.forEach((bar, i) => {

        const mapping = [
            2,4,6,9,13,18,24,32,
            32,24,18,13,9,6,4,2
        ];

        let v =
            data[mapping[i]] || 0;

        if (i >= 6 && i <= 9) {
            v *= 1.0;
        }

        const h =
            Math.max(
                3,
                Math.min(22, v / 10)
            );

        bar.style.height =
            h + "px";

        bar.classList.remove(
            "eq-red",
            "eq-orange",
            "eq-yellow",
            "eq-green",
            "eq-cyan",
            "eq-blue",
            "eq-purple",
            "eq-pink"
        );

        if (h < 5)
            bar.classList.add("eq-red");

        else if (h < 8)
            bar.classList.add("eq-orange");

        else if (h < 11)
            bar.classList.add("eq-yellow");

        else if (h < 14)
            bar.classList.add("eq-green");

        else if (h < 17)
            bar.classList.add("eq-cyan");

        else if (h < 19)
            bar.classList.add("eq-blue");

        else if (h < 21)
            bar.classList.add("eq-purple");

        else
            bar.classList.add("eq-pink");

    });

}


/* =========================================================
   CURSOR-EFFEKT
   ========================================================= */

let letzteX = 0;
let letzteY = 0;

let letzterSpawn = 0;

let aktiveGlitzer = 0;

const MAX_GLITZER = 180;


/* =========================================================
   MAUSBEWEGUNG
   ========================================================= */

document.addEventListener(
    "mousemove",
    function(event) {

        erzeugeBewegungsEffekt(
            event.clientX,
            event.clientY
        );

    }
);


/* =========================================================
   TOUCH-BEWEGUNG
   ========================================================= */

document.addEventListener(
    "touchmove",
    function(event) {

        if (
            !event.touches ||
            !event.touches.length
        ) {
            return;
        }

        const touch =
            event.touches[0];

        erzeugeBewegungsEffekt(
            touch.clientX,
            touch.clientY
        );

    },
    {
        passive: true
    }
);


/* =========================================================
   KLICK
   ========================================================= */

document.addEventListener(
    "click",
    function(event) {

        klickEffekt(
            event.clientX,
            event.clientY
        );

    }
);


/* =========================================================
   BEWEGUNGS-EFFEKT
   ========================================================= */

function erzeugeBewegungsEffekt(
    x,
    y
) {

    const dx =
        x - letzteX;

    const dy =
        y - letzteY;

    const entfernung =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    const jetzt =
        performance.now();


    if (entfernung < 2) {
        return;
    }


    if (
        jetzt - letzterSpawn < 12
    ) {

        letzteX = x;
        letzteY = y;

        return;
    }


    if (
        aktiveGlitzer >= MAX_GLITZER
    ) {

        letzteX = x;
        letzteY = y;

        return;
    }


    let nx = 0;
    let ny = 0;


    if (entfernung > 0) {

        nx =
            dx / entfernung;

        ny =
            dy / entfernung;

    }


    const trailX = x;
    const trailY = y;


    createGlitzer(
        trailX,
        trailY,
        false,
        nx,
        ny
    );


    createStaub(
        trailX,
        trailY
    );

    createStaub(
        trailX,
        trailY
    );

    createStaub(
        trailX - nx * 6,
        trailY - ny * 6
    );

    createStaub(
        trailX - nx * 12,
        trailY - ny * 12
    );

    createStaub(
        trailX - nx * 25,
        trailY - ny * 25
    );

    createStaub(
        trailX - nx * 40,
        trailY - ny * 40
    );


    if (Math.random() > .68) {

        createGlitzer(
            trailX,
            trailY,
            true,
            nx,
            ny
        );

    }


    if (entfernung > 15) {

        createStaub(
            trailX,
            trailY
        );

        createStaub(
            trailX - nx * 15,
            trailY - ny * 15
        );

        createStaub(
            trailX - nx * 30,
            trailY - ny * 30
        );


        if (entfernung > 28) {

            createStaub(
                trailX - nx * 45,
                trailY - ny * 45
            );

            createStaub(
                trailX - nx * 60,
                trailY - ny * 60
            );

        }

    }


    letzterSpawn = jetzt;

    letzteX = x;

    letzteY = y;

}


/* =========================================================
   HAUPT-GLITZER
   ========================================================= */

function createGlitzer(
    x,
    y,
    grosser = false,
    nx = 0,
    ny = 0
) {

    if (
        aktiveGlitzer >= MAX_GLITZER
    ) {
        return;
    }


    const glitzer =
        document.createElement("div");


    glitzer.className =
        grosser
            ? "glitzer long"
            : "glitzer";


    if (
        Math.random() < .5
    ) {

        glitzer.style.setProperty(
            "--color",
            "#ff8500"
        );

    } else {

        glitzer.style.setProperty(
            "--color",
            "#ffe000"
        );

    }


    const size =
        grosser
            ? 10 + Math.random() * 5
            : 4 + Math.random() * 4;


    glitzer.style.setProperty(
        "--size",
        size + "px"
    );


    const seitlich =
        (Math.random() - .5) * 5;


    const px = -ny;
    const py = nx;


    const sx =
        px * seitlich;

    const sy =
        py * seitlich;


    const mx =
        sx -
        nx * (
            16 +
            Math.random() * 16
        );

    const my =
        sy -
        ny * (
            16 +
            Math.random() * 16
        );


    const ex =
        mx -
        nx * (
            32 +
            Math.random() * 35
        ) +
        (Math.random() - .5) * 5;

    const ey =
        my -
        ny * (
            32 +
            Math.random() * 35
        ) +
        (Math.random() - .5) * 5;


    glitzer.style.setProperty(
        "--sx",
        sx + "px"
    );

    glitzer.style.setProperty(
        "--sy",
        sy + "px"
    );

    glitzer.style.setProperty(
        "--mx",
        mx + "px"
    );

    glitzer.style.setProperty(
        "--my",
        my + "px"
    );

    glitzer.style.setProperty(
        "--ex",
        ex + "px"
    );

    glitzer.style.setProperty(
        "--ey",
        ey + "px"
    );


    const duration =
        900 +
        Math.random() * 550;


    glitzer.style.setProperty(
        "--duration",
        duration + "ms"
    );


    glitzer.style.left =
        x + "px";

    glitzer.style.top =
        y + "px";


    aktiveGlitzer++;


    document.body.appendChild(
        glitzer
    );


    setTimeout(
        function() {

            glitzer.remove();

            aktiveGlitzer--;

        },
        duration + 60
    );

}


/* =========================================================
   GLITZERSTAUB
   ========================================================= */

function createStaub(
    x,
    y
) {

    if (
        aktiveGlitzer >= MAX_GLITZER
    ) {
        return;
    }


    const staub =
        document.createElement("div");


    staub.className =
        "staub";


    if (
        Math.random() < .5
    ) {

        staub.style.setProperty(
            "--color",
            "#ff8500"
        );

    } else {

        staub.style.setProperty(
            "--color",
            "#ffe000"
        );

    }


    const size =
        1.5 +
        Math.random() * 2.5;


    staub.style.setProperty(
        "--staub-size",
        size + "px"
    );


    const startX =
        (Math.random() - .5) * 20;

    const startY =
        (Math.random() - .5) * 20;


    const dx =
        (Math.random() - .5) * 48;

    const dy =
        (Math.random() - .5) * 48;


    staub.style.left =
        (x + startX) + "px";

    staub.style.top =
        (y + startY) + "px";


    staub.style.setProperty(
        "--dx",
        dx + "px"
    );

    staub.style.setProperty(
        "--dy",
        dy + "px"
    );


    const duration =
        650 +
        Math.random() * 550;


    staub.style.setProperty(
        "--duration",
        duration + "ms"
    );


    aktiveGlitzer++;


    document.body.appendChild(
        staub
    );


    setTimeout(
        function() {

            staub.remove();

            aktiveGlitzer--;

        },
        duration + 60
    );

}


/* =========================================================
   KLICK-EXPLOSION
   ========================================================= */

function klickEffekt(
    x,
    y
) {

    const flash =
        document.createElement("div");


    flash.className =
        "klick-flash";


    flash.style.left =
        x + "px";

    flash.style.top =
        y + "px";


    document.body.appendChild(
        flash
    );


    for (
        let i = 0;
        i < 18;
        i++
    ) {

        createExplosionsGlitzer(
            x,
            y,
            Math.random() > .65
        );

    }


    for (
        let i = 0;
        i < 18;
        i++
    ) {

        createExplosionStaub(
            x,
            y
        );

    }


    setTimeout(
        function() {

            flash.remove();

        },
        500
    );

}


/* =========================================================
   EXPLOSIONS-GLITZER
   ========================================================= */

function createExplosionsGlitzer(
    x,
    y,
    grosser = false
) {

    if (
        aktiveGlitzer >= MAX_GLITZER
    ) {
        return;
    }


    const glitzer =
        document.createElement("div");


    glitzer.className =
        grosser
            ? "glitzer long"
            : "glitzer";


    if (
        Math.random() < .5
    ) {

        glitzer.style.setProperty(
            "--color",
            "#ff8500"
        );

    } else {

        glitzer.style.setProperty(
            "--color",
            "#ffe000"
        );

    }


    const size =
        grosser
            ? 13 + Math.random() * 8
            : 7 + Math.random() * 7;


    glitzer.style.setProperty(
        "--size",
        size + "px"
    );


    const winkel =
        Math.random() *
        Math.PI *
        2;


    const entfernung =
        grosser
            ? 55 + Math.random() * 55
            : 35 + Math.random() * 70;


    const sx =
        (Math.random() - .5) * 6;

    const sy =
        (Math.random() - .5) * 6;


    const mx =
        Math.cos(winkel) *
        entfernung *
        .45;

    const my =
        Math.sin(winkel) *
        entfernung *
        .45;


    const ex =
        Math.cos(winkel) *
        entfernung;

    const ey =
        Math.sin(winkel) *
        entfernung;


    glitzer.style.setProperty(
        "--sx",
        sx + "px"
    );

    glitzer.style.setProperty(
        "--sy",
        sy + "px"
    );

    glitzer.style.setProperty(
        "--mx",
        mx + "px"
    );

    glitzer.style.setProperty(
        "--my",
        my + "px"
    );

    glitzer.style.setProperty(
        "--ex",
        ex + "px"
    );

    glitzer.style.setProperty(
        "--ey",
        ey + "px"
    );


    const duration =
        500 +
        Math.random() * 350;


    glitzer.style.setProperty(
        "--duration",
        duration + "ms"
    );


    glitzer.style.left =
        x + "px";

    glitzer.style.top =
        y + "px";


    aktiveGlitzer++;


    document.body.appendChild(
        glitzer
    );


    setTimeout(
        function() {

            glitzer.remove();

            aktiveGlitzer--;

        },
        duration + 60
    );

}


/* =========================================================
   EXPLOSIONS-STAUB
   ========================================================= */

function createExplosionStaub(
    x,
    y
) {

    if (
        aktiveGlitzer >= MAX_GLITZER
    ) {
        return;
    }


    const staub =
        document.createElement("div");


    staub.className =
        "staub";


    if (
        Math.random() < .5
    ) {

            "--color",
            "#ff8500"
        );

    } else {

        staub.style.setProperty(
            "--color",
            "#ffe000"
        );

    }


    const size =
        3 +
        Math.random() * 4;


    staub.style.setProperty(
        "--staub-size",
        size + "px"
    );


    const winkel =
        Math.random() *
        Math.PI *
        2;


    const entfernung =
        35 +
        Math.random() * 75;


    const dx =
        Math.cos(winkel) *
        entfernung;

    const dy =
        Math.sin(winkel) *
        entfernung;


    staub.style.left =
        x + "px";

    staub.style.top =
        y + "px";


    staub.style.setProperty(
        "--dx",
        dx + "px"
    );

    staub.style.setProperty(
        "--dy",
        dy + "px"
    );


    const duration =
        450 +
        Math.random() * 400;


    staub.style.setProperty(
        "--duration",
        duration + "ms"
    );


    aktiveGlitzer++;


    document.body.appendChild(
        staub
    );


    setTimeout(
        function() {

            staub.remove();

            aktiveGlitzer--;

        },

    );

}
